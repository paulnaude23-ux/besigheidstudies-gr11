@keyframes gloei{0%,100%{text-shadow:0 0 6px rgba(229,22,43,.6)}50%{text-shadow:0 0 18px rgba(229,22,43,.9)}}</style></head><body><canvas id="cf"></canvas><div id="app"></div><script>
const TOPICS = [
  { naam: "Besigheidsomgewings", em: "🌐", sub: "H1 · Eenheid 1.1–1.3" },
  { naam: "Mikro- & markuitdagings", em: "⚡", sub: "H2 · Eenheid 2.1–2.2" },
  { naam: "Makro-omgewing", em: "🏛️", sub: "H2 · Eenheid 2.3" },
  { naam: "Aanpassing & invloed", em: "🤝", sub: "H3 · Eenheid 3.1–3.3" },
  { naam: "Sosio-ekonomiese kwessies", em: "📉", sub: "H4 · Eenheid 4.1" },
  { naam: "Rowery & nywerheidsverhoudinge", em: "⚖️", sub: "H4 · Eenheid 4.2–4.3" },
  { naam: "Bemarking", em: "🛍️", sub: "H10 · Produk, prys, plek, promosie" },
  { naam: "Produksiestelsels", em: "🏭", sub: "H11 · Massa, lot, stuk" },
  { naam: "Menslike hulpbronne", em: "👥", sub: "H18 · Werwing tot wetgewing" },
];

// Die korrekte antwoord is altyd o[0]; opsies word geskommel wanneer dit gewys word.
const QS = [
  { t: 0, q: "Watter omgewing is die interne besigheidsomgewing (alles binne die besigheid)?", o: ["Mikro-omgewing", "Markomgewing", "Makro-omgewing", "Globale omgewing"], why: "Die mikro-omgewing is die interne omgewing. Die besigheid het VOLLE beheer daaroor." },
  { t: 0, q: "Oor watter omgewing het die besigheid GEEN beheer nie?", o: ["Makro-omgewing", "Mikro-omgewing", "Markomgewing", "Organisasiekultuur"], why: "Die makro-omgewing is die breë eksterne omgewing. Die besigheid moet daarby aanpas." },
  { t: 0, q: "Watter stelling beskryf die markomgewing?", o: ["Die direkte eksterne omgewing waaroor die besigheid beperkte beheer het", "Die interne omgewing waaroor die besigheid volle beheer het", "Die breë eksterne omgewing sonder enige beheer", "Slegs die besigheid se werknemers"], why: "Markomgewing = direkte eksterne omgewing, beperkte/min beheer." },
  { t: 0, q: "Watter een is 'n komponent van die MARKomgewing?", o: ["Verskaffers", "Organisasiekultuur", "Politieke faktore", "Bestuur en leierskap"], why: "Markomgewing: verbruikers/kliënte, verskaffers, tussengangers, mededingers en ander organisasies (GBO's, NRO's, reguleerders, vakbonde)." },
  { t: 0, q: "Watter een is NIE 'n komponent van die makro-omgewing nie?", o: ["Tussengangers", "Wetlike", "Tegnologiese", "Fisiese"], why: "Tussengangers is deel van die markomgewing. Makro: sosiaal, polities, wetlik, ekonomies, tegnologies, fisies, globaal." },
  { t: 0, q: "Watter een is 'n komponent van die mikro-omgewing?", o: ["Visie, missiestelling, doelwitte en mikpunte", "Mededingers", "Wisselkoerse", "Reguleerders"], why: "Mikro: visie/missie, organisasiestruktuur, hulpbronne, organisasiekultuur, bestuur en leierskap, agt besigheidsfunksies." },
  { t: 0, q: "Hoe kan 'n besigheid sy VERSKAFFERS beïnvloed?", o: ["Deur langtermynkontrakte teen vaste pryse te onderteken", "Deur belasting te verhoog", "Deur die rentekoers te verander", "Deur sy missiestelling te hersien"], why: "Langtermynkontrakte vir insette teen vaste pryse, strategiese alliansies, of grootmaat aankope vir afslag." },
  { t: 0, q: "Hoe kan besighede tog 'n mate van invloed op die makro-omgewing hê?", o: ["Invloedwerwing, verskansing teen inflasie en netwerkvorming", "Deur die inflasiekoers self te bepaal", "Deur nuwe wette te maak", "Deur die weer te beheer"], why: "Hulle kan saam invloedwerwing doen, verskans teen inflasie (goud, olie, eiendom) en netwerk oor tegnologiese uitdagings." },
  { t: 0, q: "Wat is 'n voordeel as 'n besigheid betrokke is in die makro-omgewing?", o: ["Hulle kan regeringstenders en kontrakte bekom", "Hulle betaal meer belasting", "Hulle hoef nie te bemark nie", "Mededingers verdwyn"], why: "Ook: goeie publisiteit, lojale klante, vaardige werknemers, belastingafslag, beleggers trek." },
  { t: 0, q: "Hoe kan besighede betrokke raak in die makro-omgewing?", o: ["Werksgeleenthede skep en sosiale verantwoordelikheidsprogramme onderneem", "Pryse so hoog moontlik maak", "Werkers aflê", "Wetgewing ignoreer"], why: "Ook: uitvoermarkte in Afrika ontgin, navorsing, kollektiewe bedinging, Privaat-Publieke vennootskappe, opleiding." },

  { t: 1, q: "Werknemers wat nie die visie, missie en doelwitte ondersteun nie en altyd kla, is...", o: ["Moeilike werknemers", "Onopgeleide werknemers", "Vakbondlede", "Bestuurders"], why: "Moeilike werknemers se aksies kan konflik in die span veroorsaak." },
  { t: 1, q: "Wat is 'n gevolg van 'n gebrek aan visie en missie?", o: ["Konflik, negatiwiteit en swak produktiwiteit", "Hoër winste", "Beter spanwerk", "Laer koste"], why: "Bestuur en werknemers het verskillende idees oor die doelwitte, wat konflik veroorsaak." },
  { t: 1, q: "Wat is 'n sloerstaking?", o: ["Werkers kom werk toe maar werk doelbewus teen 'n stadiger tempo", "Werkers weier om te werk totdat eise nagekom is", "Die werkgewer sluit werkers uit", "Werkers bedank almal saam"], why: "By 'n staking weier werkers om te werk; by 'n sloerstaking werk hulle doelbewus stadiger." },
  { t: 1, q: "Mededinging verwys na...", o: ["Besighede wat dieselfde of soortgelyke produkte of dienste lewer", "Die besigheid se eie werknemers", "Die regering se wette", "Verskaffers van grondstowwe"], why: "As 'n besigheid nie die mededingers se gehalte of pryse kan ewenaar nie, verloor dit kliënte." },
  { t: 1, q: "Wat gebeur as verskaffers se grondstowwe onderbreek word?", o: ["Produksie en winsgewendheid neem af", "Produksie styg", "Pryse daal outomaties", "Daar is geen impak nie"], why: "Sonder grondstowwe kan die besigheid nie goedere produseer nie; kliënte gaan verlore en wins daal." },
  { t: 1, q: "Demografie verwys na...", o: ["Statistiek van die bevolking soos geslag, ouderdom, ras, opvoeding en inkomste", "Verbruikers se leefstyl en belangstellings", "Die besigheid se struktuur", "Die regering se beleid"], why: "Leefstyl, voorkeure en belangstellings = psigografie." },
  { t: 1, q: "Wat kan veranderinge in verbruikersvoorkeure veroorsaak?", o: ["Veroudering van voorraad en daling in winsmarges", "Meer werkers", "Laer belasting", "Beter verskaffers"], why: "Besighede moet voortdurend navorsing doen oor wat verbruikers nodig het." },
  { t: 1, q: "Wat sluit sosio-kulturele faktore in?", o: ["Taal, gebruike, inkomstevlakke en voorkeure van 'n kultuur", "Rentekoerse en wisselkoerse", "Nuwe masjinerie", "Klimaatsverandering"], why: "Besighede moet seker maak hul bemarking is nie aanstoot gewend vir kulturele groepe nie." },
  { t: 1, q: "Watter een is 'n manier om mededinging te hanteer?", o: ["Lojaliteitskemas en lae-koste ekstras aanbied", "Pryse verhoog sonder rede", "Klantediens verminder", "Minder adverteer"], why: "Ook: unieke produkte, persoonlike dienste, goedkoper pryse, hoë gehalte, goeie opgeleide werknemers." },
  { t: 1, q: "Wat is 'n gevolg van 'n gebrek aan bestuursvaardighede?", o: ["Hulpbronne word vermors en doelwitte word nie bereik nie", "Werknemers word meer gemotiveer", "Wins styg", "Daar is geen konflik"], why: "Swak bestuur lei tot 'n ongelukkige en gefrustreerde werkerskorps." },

  { t: 2, q: "Hoe word netto inkomste bepaal?", o: ["Bruto inkomste minus alle uitgawes", "Bruto inkomste plus bonusse", "Slegs die salaris voor belasting", "Uitgawes minus inkomste"], why: "As netto inkomste afneem, koop verbruikers net noodsaaklike goedere." },
  { t: 2, q: "Wat kan 'n verandering in regering veroorsaak?", o: ["Politieke onstabiliteit wat beleggers en toeriste afskrik", "Altyd laer pryse", "Meer grondstowwe", "Geen impak op besighede"], why: "Besighede moet aanpas by nuwe wette en regeringsbeleid." },
  { t: 2, q: "Watter wet vereis voorkeur aan voorheen benadeelde individue by aanstellings?", o: ["Wet op Gelyke Indiensneming (WGI) No. 55 van 1998", "Nasionale Kredietwet No. 34 van 2005", "Wet op Verbruikersbeskerming No. 68 van 2008", "COIDA No. 61 van 1997"], why: "Dit is moeilik, want kandidate het nie altyd die nodige kwalifikasies en ervaring nie." },
  { t: 2, q: "Wat is waar van mikrolenings?", o: ["Hoër rentekoerse en korter terugbetalingsperiodes", "Laer rentekoerse as banke", "Hulle word deur die Bankwet gereguleer", "Net groot maatskappye kan dit kry"], why: "Daar is min beskerming, want mikrolenings word nie deur die Bankwet (No. 94 van 1990) gereguleer nie." },
  { t: 2, q: "Globalisering verwys na...", o: ["Die uitruil van produkte, dienste, kapitaal en arbeid oor nasionale grense", "Slegs plaaslike handel", "Die regering se begroting", "Werkers se stakings"], why: "Voordeel: vinniger oordrag van kennis en vaardighede. Nadeel: storting, migrasie van geskoolde arbeid." },
  { t: 2, q: "Wat doen arbeidsbeperkinge (wetgewing)?", o: ["Skep 'n wetlike raamwerk wat werknemers teen uitbuiting beskerm", "Laat werkgewers toe om enigiets te doen", "Verhoog alle salarisse", "Verbied vakbonde"], why: "Sommige werkgewers sien dit as beperkend; ander as beskerming van werkers se regte." },
  { t: 2, q: "Watter wet beskerm besighede en verbruikers teen roekelose kredietverlening?", o: ["Nasionale Kredietwet (NKW) No. 34 van 2005", "WAV No. 66 van 1995", "WBDV No. 75 van 1997", "WVO No. 68 van 2008"], why: "NKW: teen nalatige en roekelose kredietverleningspraktyke." },
  { t: 2, q: "Wat vereis die Wet op Vaardigheidsontwikkeling (WVO)?", o: ["Werkgewers moet bydra tot opleiding van hul werknemers", "Minimum werksure", "Vergoeding vir beserings", "Gelyke indiensneming"], why: "WVO No. 68 van 2008." },
  { t: 2, q: "Sosiale waardes verwys na...", o: ["Oortuigings, norme en waardes wat 'n groep in die samelewing deel", "Die bevolking se ouderdom", "Pryse van goedere", "Die besigheid se wins"], why: "Dit beïnvloed koopvoorkeure; besighede het nie beheer oor verbruikers se sosiale waardes nie." },
  { t: 2, q: "Watter wet stel minimum standaarde vir indiensneming?", o: ["Wet op Basiese Diensvoorwaardes (WBDV)", "Nasionale Kredietwet", "Wet op Verbruikersbeskerming", "Wet op Gelyke Indiensneming"], why: "WBDV No. 75 van 1997 omskryf die voorwaardes van indiensneming." },

  { t: 3, q: "Wat is 'n samesmelting?", o: ["Twee maatskappye vorm met ooreenkoms 'n nuwe besigheid", "Een besigheid koop meerderheid aandele teen die ander se wense", "Besighede werk saam maar bly afsonderlik", "'n Besigheid sluit"], why: "Hulle deel hulpbronne, wat tot groei en volhoubaarheid lei." },
  { t: 3, q: "Wanneer vind 'n oorname plaas?", o: ["Een besigheid neem beheer oor deur die meerderheid aandele te bekom", "Twee besighede stem in om saam te smelt", "'n Besigheid word 'n filiaal sonder aankoop", "Besighede vorm 'n vennootskap"], why: "Soms gebeur dit teen die wense van die besigheid." },
  { t: 3, q: "Wat is 'n alliansie?", o: ["'n Ooreenkoms waar besighede saamwerk maar afsonderlike entiteite bly", "'n Nuwe besigheid uit twee", "Een besigheid koop 'n ander", "'n Staking"], why: "Alliansies maak dit moontlik om meer mededingend te wees." },
  { t: 3, q: "MTN wat Afrihost se aandele koop, is 'n voorbeeld van 'n...", o: ["Verkryging", "Alliansie", "Sloerstaking", "Netwerk"], why: "Verkryging: 'n besigheid koop 'n ander besigheid teen 'n ooreengekome prys." },
  { t: 3, q: "Strategiese reaksie verwys na...", o: ["Hoe besighede op uitdagings reageer deur planne in plek te stel", "Om niks te doen nie", "Net om pryse te verlaag", "Om werkers af te dank"], why: "Bestuur ontleed inligting en identifiseer belanghebbendes." },
  { t: 3, q: "Invloedwerwing is...", o: ["'n Georganiseerde proses om regeringsbeleid te beïnvloed of te verander", "Om nuwe werkers te werf", "Om voorraad te koop", "'n Tipe advertensie"], why: "Bv. om wette soos kinderarbeidswette of wette oor skoon lug en water te verander." },
  { t: 3, q: "Hoe kan 'n besigheid teen inflasie verskans?", o: ["Surplusfondse belê in goud, olie of eiendom", "Al sy kontant in die kluis hou", "Pryse verlaag", "Meer krediet gee"], why: "Bates met intrinsieke waarde beskerm kapitaal teen inflasie." },
  { t: 3, q: "Bestuurders wat saam gholf speel om besighede te netwerk, is 'n voorbeeld van...", o: ["Informele netwerkvorming", "Formele netwerkvorming", "'n Oorname", "Invloedwerwing"], why: "Formele netwerkvorming = georganiseerde sakekamers." },
  { t: 3, q: "Die drievoudige sleutelaspekte fokus op...", o: ["Mense, die planeet en wins", "Prys, plek en produk", "Werwing, seleksie en induksie", "Massa, lot en stuk"], why: "'n Raamwerk vir sosiale en omgewingsverantwoordelikheid." },
  { t: 3, q: "Wat is 'n voordeel van sosiale verantwoordelikheidsprojekte (KMI)?", o: ["Werknemers se moraal en werksbevrediging verhoog", "Belasting styg", "Klante word minder lojaal", "Die besigheid se beeld verswak"], why: "Ook: bemarkingstrategie, trek beleggers, klantelojaliteit, positiewe beeld." },
  { t: 3, q: "Hoe kan besighede magsverhoudinge vorm?", o: ["Strategiese alliansies/vennootskappe en oorreding van groot beleggers", "Deur hul personeel te verminder", "Deur geen kontak met ander te hê", "Deur pryse te verhoog"], why: "Magsverhouding = 'n maatreël van die besigheid om sy omgewing en die gedrag van ander te beheer." },

  { t: 4, q: "Inflasie verwys na...", o: ["Die algemene styging van pryse en daling in die koopkrag van geld", "'n Daling in pryse", "Bevolkingsgroei", "Laer belasting"], why: "Stygende inflasie verminder verbruikers se besteebare inkomste." },
  { t: 4, q: "Wat is 'n impak van inflasie op besighede?", o: ["Afname in verkope omdat verbruikers minder bestee", "Meer verkope", "Goedkoper grondstowwe", "Hoër winste"], why: "Grondstowwe kos meer, verkope daal en werknemers moet dalk afgelê word." },
  { t: 4, q: "Ekonomiese misdaad staan ook bekend as...", o: ["Witboordjiemisdaad", "Storting", "Rowery", "Sloerstaking"], why: "Voorbeelde: diefstal van identiteit, kredietkaartbedrog en geldwassery." },

if(S.m==='o'){if(right){b.classList.add('ok');if(!S.tried){hit();if(S.mode==='foute')delFout(it.i)}const g=pick(REG);mood('happy',g);fb.innerHTML=`<b>${g}</b>`+(S.st>=3?` <span class="fl">🔥 ${S.st} op 'n ry!</span>`:'')+`<div class="ex">💡 ${esc(q.why)}</div>`;lock();next()}
else{b.classList.add('bad');b.disabled=true;vib([40,40,40]);S.tried=true;S.st=0;const m=pick(VER);mood('sad',m);fb.textContent=m}}
else{if(right)hit();else S.st=0;setTimeout(adv,right?350:0)}}
function lock(){document.querySelectorAll('button.op').forEach(x=>x.disabled=true)}
function next(){document.getElementById('nx').innerHTML=`<button class="big" onclick="adv()">Volgende ➜</button>`;document.getElementById('nx').scrollIntoView({behavior:'smooth',block:'nearest'})}
function adv(){S.i++;window.scrollTo(0,0);S.i<S.items.length?show():end()}
function end(){const n=S.items.length,p=Math.round(S.sc/n*100);let extra='',nb=false;
if(S.mode!=='foute'){const b=best(),key=S.mode==='lvl'?(LV[S.lv].test?'X':S.t):S.t;if(p>(b[key]??-1)){b[key]=p;sv('bs11Best',b);nb=true}}
let s=0;if(S.mode==='lvl'){s=p===100?3:p>=80?2:p>=50?1:0;const st=stars();if(s>(st[S.lv]||0)){st[S.lv]=s;sv('bs11Stars',st)}
extra=`<div class="big3">${[1,2,3].map(k=>`<span style="animation-delay:${.4+k*.3}s">${k<=s?'★':'☆'}</span>`).join('')}</div>`+(s?(S.lv+1<LV.length?`<p>🔓 Volgende album oop: <b>${esc(LV[S.lv+1].n)}</b></p><button class="big" onclick="startLevel(${S.lv+1})">Volgende album ➜</button>`:'<p>🏆 Al die albums voltooi. Wêreldtoer-status!</p>'):'<p>Kry minstens 50% om die volgende album oop te sluit.</p>')}
if(S.mode==='foute')extra=`<p>Foute oor in jou bank: ${foute().length}</p>`;
const bd=[];if(p>=80)bd.push('💿 Album-ster');if(p===100)bd.push('🌍 Wêreldtoer (100%)');if(S.max>=5)bd.push(`🔥 Vuurstreep (${S.max} op 'n ry)`);if(nb)bd.push('📈 Nuwe persoonlike beste');
const msg=p>=90?"Ongelooflik, STAY. Eksamen-gereed. 🖤":p>=70?"Goed so, STAY! Nog 'n bietjie skaaf. ❤️":p>=50?"Op koers. Hersien jou foute en probeer weer.":"Elke trainee begin hier. Gaan deur die verduidelikings en probeer weer. 💪";
const wr=[...new Set(S.wrong)];
app.innerHTML=`<div class="card c res">${guide(msg,p>=50?'happy':'sad')}<h2 class="pc">${p}%</h2><div class="sil">${S.sc} / ${n} reg</div>${extra}${bd.length?`<div class="bds">${bd.map(x=>`<span class="bd">${x}</span>`).join('')}</div>`:''}</div>
${wr.length?`<div class="card"><b>📝 Hersien</b>${wr.map(i=>`<div class="fout"><div>${esc(QS[i].q)}</div><div class="grn">✔ ${esc(QS[i].o[0])}</div><div class="dof">${esc(QS[i].why)}</div></div>`).join('')}</div>`:''}
<div class="row c">${wr.length?`<button class="sec2" onclick="begin({mode:'foute',t:'F',m:'o',items:qi(shuf([${wr}]))})">🔁 Herprobeer foute (${wr.length})</button>`:''}
<button class="sec2" onclick="${S.mode==='lvl'?`startLevel(${S.lv})`:S.mode==='foute'?'startFoute()':`startFree(${JSON.stringify(S.t).replace(/"/g,"'")},'${S.m}')`}">Probeer weer 🔁</button><button class="sec2" onclick="home()">Tuis 🏠</button></div>`;
window.scrollTo(0,0);if(p>=70)confetti()}
function burst(){const f=document.getElementById('fb');if(!f)return;const w=document.createElement('div');w.className='burst';w.innerHTML=['❤️','🖤','✦','🐺','✨','❤️','✦'].map((e,i)=>`<span style="left:${8+i*13}%;animation-delay:${i*.06}s">${e}</span>`).join('');f.parentNode.appendChild(w);setTimeout(()=>w.remove(),1400)}
function stopCf(){cancelAnimationFrame(CF);const c=document.getElementById('cf');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function confetti(){stopCf();const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const col=['#e5162b','#c9ccd4','#ffffff','#ff4d5e','#8a8d96'];
let P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:3+Math.random()*5,v:2+Math.random()*3,s:Math.random()*6,c:pick(col)})),t=0;
(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(t/20+p.s);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++t<240)CF=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
home();

new MutationObserver(()=>{app.classList.remove('in');void app.offsetWidth;app.classList.add('in')}).observe(app,{childList:true});
</script></body></html>
